<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本体知识 · 20组</title><style>
:root{--bg:#10191f;--surface:#17242d;--border:#35434a;--text:#f3eee1;--text-dim:#a8b2b7;--gold:#e4c37c;--green:#90b59b;--blue:#a6bfcc;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
button,input{font:inherit}button{cursor:pointer;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:10px 16px}
button:hover{border-color:var(--gold)}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{cursor:default;opacity:.4}
header{height:76px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:16px}
h1{font-family:Georgia,"Noto Serif SC","Microsoft YaHei",serif;font-size:23px;font-weight:500;margin:0;letter-spacing:1px}
.status{display:flex;align-items:center;gap:18px}.status output{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.shell{display:grid;grid-template-columns:284px minmax(0,1fr);height:calc(100dvh - 76px)}aside{border-right:1px solid var(--border);overflow:auto}
ol{list-style:none;margin:0;padding:12px}li{position:relative;margin:0;padding:0;border-bottom:1px solid var(--border)}
.group-label{padding:15px 8px 7px;color:var(--gold);font-size:12px;letter-spacing:1px;grid-column:1/-1}.choice{padding:8px 6px;display:grid;grid-template-columns:36px minmax(0,1fr) 26px;align-items:center;gap:8px}.choice[data-active=true]{background:#23333e}
.choice button{background:transparent;border:0;padding:7px 2px;text-align:left;font-size:14px;line-height:1.55;overflow-wrap:anywhere}.choice button:hover{color:var(--gold)}
.index{font-family:Consolas,monospace;color:var(--text-dim);font-size:14px;text-align:center}.choice[data-active=true] .index{color:var(--gold)}
input[type=checkbox]{accent-color:var(--gold);width:18px;height:18px;cursor:pointer}
main{min-width:0;display:flex;flex-direction:column;padding:22px 28px;overflow:auto;gap:18px}
.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:42px}
h2{font-size:20px;font-weight:500;line-height:1.5;margin:0;overflow-wrap:anywhere}.meta{white-space:nowrap;color:var(--text-dim);font-size:14px}
figure{margin:0;min-width:0;flex:1;display:flex;align-items:center;justify-content:center;background:#06090b;border:1px solid var(--border);border-radius:6px;overflow:hidden;min-height:220px}
figure img{display:block;width:100%;height:100%;max-height:calc(100dvh - 245px);object-fit:contain;cursor:zoom-in}
.actions{display:flex;gap:10px;align-items:center;justify-content:space-between}.page-nav,.select-nav{display:flex;gap:10px;align-items:center}
#toggle[aria-pressed=true]{background:#334a3d;border-color:var(--green);color:#dcf3e2}
#position{font:14px Consolas,monospace;color:var(--text-dim);min-width:60px;text-align:center}
dialog{padding:12px;border:1px solid var(--border);background:var(--bg);max-width:98vw;max-height:96dvh;color:var(--text)}
dialog::backdrop{background:rgb(0 0 0/.85)}.original-tools{position:sticky;top:0;display:flex;justify-content:flex-end;background:var(--bg);padding-bottom:10px}
dialog img{display:block;width:1280px;max-width:none;height:auto}.original-scroll{overflow:auto;max-width:calc(98vw - 28px);max-height:calc(96dvh - 86px)}
@media(prefers-color-scheme:light){:root{--bg:#f1eee6;--surface:#fffdf8;--border:#c8c4b8;--text:#24333c;--text-dim:#626e72;--gold:#856522;--green:#3b7051;--blue:#3c647c;color-scheme:light}.choice[data-active=true]{background:#e2e9e8}#toggle[aria-pressed=true]{background:#dbe9df;color:#254d35}}
@media(max-width:900px){header{height:auto;min-height:76px;padding:16px;flex-wrap:wrap}h1{font-size:20px}.shell{height:auto;display:flex;flex-direction:column}aside{border-right:0;border-bottom:1px solid var(--border);max-height:210px}ol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.choice{grid-template-columns:30px minmax(0,1fr) 24px}main{padding:18px 12px}.viewer-head{align-items:flex-start;gap:10px}h2{font-size:17px}figure{min-height:0}figure img{height:auto;max-height:none}.actions{flex-wrap:wrap}.status{gap:12px}}
@media(max-width:480px){ol{grid-template-columns:1fr}.status{width:100%;justify-content:space-between}.actions{gap:16px}.page-nav{width:100%;justify-content:space-between}.select-nav{width:100%}.select-nav button{flex:1}.meta{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><h1>本体知识 · 20组</h1><div class="status"><output id="count" aria-live="polite">已选 0组</output><button id="copy">复制编号</button></div></header>
<div class="shell"><aside aria-label="知识组"><ol id="choices"></ol></aside><main>
<div class="viewer-head"><h2 id="title"></h2><span id="meta" class="meta"></span></div>
<figure><img id="shot" width="1280" height="720" alt=""></figure>
<div class="actions"><div class="page-nav"><button id="previous">上一组</button><output id="position"></output><button id="next">下一组</button></div><div class="select-nav"><button id="original">原图</button><button id="toggle" aria-pressed="false">选入</button></div></div>
</main></div>
<dialog id="zoom"><div class="original-tools"><button id="closeZoom">关闭</button></div><div class="original-scroll"><img id="large" width="1280" height="720" alt=""></div></dialog>
<script>
const groups=/*__GROUPS__*/;
const $=id=>document.getElementById(id);
let current=groups.findIndex(group=>group.id===location.hash.slice(1));
if(current<0)current=/*__DEFAULT_CURRENT__*/;
const saved=/*__SAVED__*/;
const storageKey=/*__STORAGE_KEY__*/;
let remembered=saved;
try{const cached=localStorage.getItem(storageKey);if(cached!==null)remembered=JSON.parse(cached);}catch{}
const selected=new Set((Array.isArray(remembered)?remembered:[]).filter(id=>groups.some(group=>group.id===id)));
function save(){try{localStorage.setItem(storageKey,JSON.stringify([...selected].sort()));}catch{}}
function choose(id){if(selected.has(id))selected.delete(id);else selected.add(id);save();render();}
function go(index){current=Math.max(0,Math.min(groups.length-1,index));history.replaceState(null,'','#'+groups[current].id);render();}
function render(){
 const group=groups[current];
 $('title').textContent=group.id+' · '+group.title;$('meta').textContent=group.count+'张';
 $('position').textContent=(current+1)+' / '+groups.length;
 $('shot').src=group.image;$('shot').alt=group.title+' 游戏内知识展示';$('large').src=group.image;$('large').alt=$('shot').alt;
 $('count').textContent='已选 '+selected.size+'组';$('toggle').textContent=selected.has(group.id)?'已选入':'选入';
 $('toggle').setAttribute('aria-pressed',String(selected.has(group.id)));$('toggle').disabled=false;
 $('previous').disabled=current===0;$('next').disabled=current===groups.length-1;
 $('choices').replaceChildren(...groups.flatMap((entry,index)=>{
  const rows=[];
  if(saved.length&&(index===0||index===saved.length)){const label=document.createElement('li');label.className='group-label';label.textContent=index===0?'已保存 '+saved.length+'组':'新候选 '+(groups.length-saved.length)+'组';rows.push(label);}
  const li=document.createElement('li');li.className='choice';li.dataset.active=String(index===current);
  const number=document.createElement('span');number.className='index';number.textContent=entry.id;
  const button=document.createElement('button');button.textContent=entry.title;button.onclick=()=>go(index);if(index===current)button.setAttribute('aria-current','true');
  const check=document.createElement('input');check.type='checkbox';check.checked=selected.has(entry.id);check.disabled=false;
  check.setAttribute('aria-label','选入 '+entry.id+' '+entry.title);check.onchange=()=>choose(entry.id);li.append(number,button,check);rows.push(li);return rows;
 }));
}
$('previous').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('toggle').onclick=()=>choose(groups[current].id);
function zoom(){$('zoom').showModal();}$('original').onclick=zoom;$('shot').onclick=zoom;$('closeZoom').onclick=()=>$('zoom').close();
$('copy').onclick=async()=>{
 const text=[...selected].sort().join('、');if(!text)return;
 try{await navigator.clipboard.writeText(text);}catch{const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove();}
 $('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制编号',1500);
};
document.addEventListener('keydown',event=>{if($('zoom').open)return;if(event.key==='ArrowLeft'){event.preventDefault();go(current-1);}if(event.key==='ArrowRight'){event.preventDefault();go(current+1);}});
render();
</script></body></html>
