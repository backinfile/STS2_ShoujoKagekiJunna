<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>纯那 Mod 设计工作台</title><!--STYLE--></head>
<body>
<svg class="card-render-defs" aria-hidden="true" width="0" height="0"><defs>
  <filter id="junna-frame-tint" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".55 0 0 0 .14  0 .85 0 0 .28  0 0 .8 0 .34  0 0 0 1 0"/></filter>
  <!-- Match the native rarity palette from the common grey plaque's luminance. -->
  <filter id="junna-uncommon-tint" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.354834 0.696847 0.135333 0 -0.278428  0.350061 0.687474 0.133513 0 0.115498  0.34903 0.685449 0.13312 0 0.141191  0 0 0 1 0"/></filter>
  <filter id="junna-rare-tint" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.196896 0.386678 0.075096 0 0.5868  0.401855 0.789189 0.153267 0 -0.072809  0.403124 0.791682 0.153751 0 -0.439005  0 0 0 1 0"/></filter>
  <clipPath id="junna-arrow-window" clipPathUnits="userSpaceOnUse"><path d="M345 90Q728 45 1110 90L1205 235L1273 350V508L1218 550L1273 593V700Q1273 727 1233 745L954 872L884 899V866Q880 836 851 802L750 720Q728 701 704 720L605 802Q575 837 572 866V899L502 872L222 745Q180 727 180 700V593L238 550L180 508V350L235 235Z"/></clipPath>
</defs></svg>
<div class="app" id="app">
  <header class="topbar">
    <button class="brand" id="edit-title" title="编辑名称"><img data-asset="card-icon" alt=""><span id="workspace-title">纯那 Mod 设计工作台</span></button>
    <nav class="tabs" role="tablist" aria-label="制作台页签"><button role="tab" id="tab-overview" data-tab="overview" aria-selected="false">总览</button><button role="tab" id="tab-flows" data-tab="flows" aria-selected="false">流派统计</button><button role="tab" id="tab-mechanisms" data-tab="mechanisms" aria-selected="true">机制</button><button role="tab" id="tab-styles" data-tab="styles" aria-selected="false">风格约定</button><button role="tab" id="tab-terms" data-tab="terms" aria-selected="false">效果与扳机</button><button role="tab" id="tab-models" data-tab="models" aria-selected="false">卡牌模型</button><button role="tab" id="tab-cards" data-tab="cards" aria-selected="false">卡池</button><button role="tab" id="tab-powers" data-tab="powers" aria-selected="false">Power</button><button role="tab" id="tab-relics" data-tab="relics" aria-selected="false">遗物</button><button role="tab" id="tab-fits" data-tab="fits" aria-selected="false">契合池</button><button role="tab" id="tab-reserve" data-tab="reserve" aria-selected="false">备用</button><button role="tab" id="tab-trash" data-tab="trash" aria-selected="false">垃圾桶</button></nav>
    <div class="global-actions"><span id="save-state" role="status">载入中</span><button class="button" id="file-state">MCP 连接中</button><button class="icon-btn" id="undo" title="撤销" aria-label="撤销" disabled>↶</button><button class="icon-btn" id="redo" title="重做" aria-label="重做" disabled>↷</button><button class="button" id="history-button">历史 <span id="history-count">0</span></button><details class="menu"><summary class="button">文件</summary><div class="menu-items"><button id="bind-local-file">绑定／另存本地文件</button><button id="read-local-file" disabled>同步 MCP</button><button id="disconnect-local-file" disabled>断开本地文件</button><button id="import-button">导入</button><button id="export-json">导出 JSON</button><button id="export-html">保存 HTML</button></div></details></div>
  </header>
  <div class="body-layout" id="body-layout">
    <aside class="sidebar" id="sidebar" aria-label="分类与筛选"></aside>
    <main class="workspace" id="workspace">
      <div class="page-header"><div><h1 id="page-title">机制</h1><span class="result-count" id="result-count"></span></div><div class="page-actions" id="page-actions"></div></div>
      <div class="work-area" id="work-area" role="tabpanel" aria-labelledby="tab-mechanisms"></div>
    </main>
    <aside class="inspector" id="inspector" aria-label="编辑栏"><div class="inspector-header"><h2 id="inspector-title">编辑</h2><button class="icon-btn" id="close-inspector" aria-label="清除选择" hidden>×</button></div><div class="preview" id="preview"></div><form id="editor-form" autocomplete="off"></form><div class="inspector-footer" id="inspector-footer" hidden><button class="button" id="duplicate-entity">复制</button><button class="button" id="reserve-entity" hidden>移入备用</button><button class="button danger" id="delete-entity">删除</button><button class="button primary" id="restore-entity" hidden>恢复</button><div class="inspector-group-actions" id="card-group-actions" hidden><button class="button" id="set-group-main">设置为主牌</button><button class="button" id="reserve-group">备用一组</button><button class="button danger" id="delete-group">删除一组</button></div></div></aside>
  </div>
</div>
<dialog id="history-dialog" class="large-dialog"><div class="dialog-head"><h2>编辑记录 <span id="history-total"></span></h2><button class="icon-btn" data-close-dialog="history-dialog" aria-label="关闭编辑记录">×</button></div><div class="history-tools"><input type="search" id="history-search" placeholder="搜索记录" aria-label="搜索记录"><select id="history-kind" aria-label="记录类型"><option value="all">全部内容</option><option value="cards">卡牌</option><option value="terms">词条</option><option value="mechanisms">机制</option><option value="archetypes">流派</option><option value="styles">风格约定</option><option value="fitPool">契合</option></select></div><div id="history-body" class="dialog-body"></div></dialog>
<dialog id="manage-dialog"><div class="dialog-head"><h2 id="manage-title">流派</h2><button class="icon-btn" data-close-dialog="manage-dialog" aria-label="关闭流派管理">×</button></div><div id="manage-body" class="dialog-body"></div></dialog>
<dialog id="knowledge-dialog" class="knowledge-dialog" aria-labelledby="knowledge-title"><div class="dialog-head"><h2 id="knowledge-title">知识牌组 <span id="knowledge-total"></span></h2><div class="knowledge-actions"><select id="knowledge-group-switch" aria-label="知识牌组" hidden></select><button type="button" class="button" id="knowledge-upgrade" aria-pressed="false">基础牌面</button><button type="button" class="button" id="knowledge-edit">编辑</button><button type="button" class="icon-btn" data-close-dialog="knowledge-dialog" aria-label="关闭知识牌组">×</button></div></div><div class="knowledge-fan" id="knowledge-fan" role="group" aria-label="同组知识牌"></div></dialog>
<dialog id="mcp-conflict-dialog" class="large-dialog" aria-labelledby="mcp-conflict-title"><div class="dialog-head"><h2 id="mcp-conflict-title">版本冲突</h2><button class="icon-btn" data-close-dialog="mcp-conflict-dialog" aria-label="关闭版本冲突">×</button></div><div id="mcp-conflict-body" class="dialog-body"></div><div class="mcp-conflict-actions"><button class="button" id="mcp-export-draft">导出草稿</button><button class="button" id="mcp-use-server">使用服务器版本</button><button class="button primary" id="mcp-merge-submit">合并并提交</button></div></dialog>
<input type="file" id="import-file" accept=".json,.html,application/json,text/html" hidden><input type="file" id="art-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<div id="toast" role="status" hidden></div>
<!--CONNECTION--><!--ASSETS--><!--DATA--><!--ROUTE_DATA--><!--APP-->
</body></html>
